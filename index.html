<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090e17">
  <meta name="description" content="A minimal fullscreen study timer for distraction-free focus, with presets and an alarm.">
  <title>Study Focus Timer | BiharKalyan.in</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --bg:#090e17;--text:#f8fafc;--muted:#9caec4;--accent:#9af0cb;--panel:#172331; }
    * { box-sizing:border-box; }
    html,body { width:100%;min-height:100%;margin:0; }
    body { overflow:hidden;min-height:100svh;background:var(--bg);color:var(--text); }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,a:focus-visible { outline:2px solid var(--accent);outline-offset:4px; }
    .stage { position:relative;display:grid;place-items:center;min-height:100svh;min-height:100dvh;width:100%;isolation:isolate; }
    .time { margin:0;padding:0 .055em;font-size:clamp(5.3rem,22vw,28rem);font-weight:750;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.065em;white-space:nowrap;text-align:center;user-select:none;font-feature-settings:"tnum"; }
    .time.long { font-size:clamp(3.4rem,15vw,18rem); }
    .time.finished { color:var(--accent); }
    .corner { position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:5; }
    .ghost { background:rgba(25,39,56,.55);color:#eef8ff;border:1px solid rgba(218,235,255,.15);border-radius:14px;opacity:.6;backdrop-filter:blur(10px);transition:opacity .18s,background .18s,transform .18s; }
    .ghost:hover,.ghost:focus-visible,.ghost[aria-expanded="true"] { opacity:1;background:rgba(37,55,75,.96); }
    .menu-toggle { display:grid;place-items:center;width:50px;height:50px;font-size:1.55rem; }
    .rail { position:fixed;top:50%;right:max(14px,env(safe-area-inset-right));transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:12px; }
    .rail button { display:grid;place-items:center;width:52px;height:52px;font-size:1.3rem; }
    .rail button:disabled { opacity:.2;cursor:not-allowed; }
    .rail button:not(:disabled):hover {transform:scale(1.06);}
    .menu {position:fixed;right:max(14px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 60px);z-index:10;width:min(350px,calc(100vw - 28px));max-height:calc(100dvh - 92px);overflow-y:auto;background:#152233;border:1px solid #34485f;border-radius:20px;padding:22px;box-shadow:0 24px 90px #000a;}
    .menu[hidden] {display:none;}
    .menu h1 {font-size:1.22rem;margin:0 0 6px;}
    .menu p {margin:0 0 20px;color:var(--muted);font-size:.85rem;line-height:1.5;}
    .section-label {font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;display:block;}
    .presets {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
    .menu button.action,.menu input {background:#213248;color:var(--text);border:1px solid #3b5069;border-radius:10px;padding:11px;min-height:43px;}
    .menu button.action:hover,.menu button.action[aria-pressed="true"] {background:#346351;color:#fff;border-color:#74c6a6;}
    .custom { display:flex;gap:8px; }
    .custom input {width:100%;min-width:0;}
    .custom button {white-space:nowrap;}
    .option {display:flex;align-items:center;gap:10px;font-size:.92rem;margin:18px 0;}
    .option input {accent-color:var(--accent);width:18px;height:18px;}
    .menu .full {width:100%;}
    .menu a {color:var(--accent);}
    .fine {font-size:.76rem!important;margin:15px 0 0!important;}
    .message {position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:clamp(.75rem,1.4vw,.9rem);color:#b5c5d6;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;}
    .message.visible {opacity:.8;}
    /* The digital clock is the only prominent element; controls stay translucent until pointed at. */
    @media (hover:hover) and (pointer:fine) {
      body:fullscreen:not(:has(.menu:not([hidden]))) .corner,
      body:fullscreen:not(:has(.menu:not([hidden]))) .rail {opacity:.06;transition:opacity .2s;}
      body:fullscreen .corner:hover,body:fullscreen .corner:focus-within,
      body:fullscreen .rail:hover,body:fullscreen .rail:focus-within {opacity:1;}
    }
    @media(max-width:640px){.time{font-size:clamp(4rem,21vw,12rem)}.time.long{font-size:clamp(2.6rem,14vw,8rem)}.rail{right:10px;gap:9px}.rail button{width:40px;height:40px;font-size:1.05rem}.menu-toggle{width:42px;height:42px}.menu{top:65px}.ghost{opacity:.35}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Fullscreen study focus timer">
    <div class="time" id="clock" role="timer" aria-label="Time remaining">25:00</div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </main>
  <div class="corner"><button id="menuToggle" class="ghost menu-toggle" type="button" aria-label="Open settings menu" aria-controls="menu" aria-expanded="false" title="Settings (M)">☰</button></div>
  <aside class="rail" aria-label="Timer controls">
    <button id="startPause" type="button" class="ghost" title="Start or pause (Space)" aria-label="Start timer">▶</button>
    <button id="reset" type="button" class="ghost" title="Reset (R)" aria-label="Reset timer">↺</button>
  </aside>
  <section class="menu" id="menu" hidden aria-label="Timer settings">
    <h1>Study Focus Timer</h1>
    <p>A distraction-free clock for students.</p>
    <span class="section-label">Quick sessions</span>
    <div class="presets">
      <button class="action" data-minutes="5" aria-pressed="false">5 min Break</button>
      <button class="action" data-minutes="25" aria-pressed="true">25 min Focus</button>
      <button class="action" data-minutes="45" aria-pressed="false">45 min Study</button>
      <button class="action" data-minutes="60" aria-pressed="false">60 min Study</button>
    </div>
    <label class="section-label" for="customMinutes">Custom duration (minutes)</label>
    <div class="custom"><input id="customMinutes" type="number" inputmode="numeric" min="1" max="999" step="1" value="30"><button class="action" type="button" id="setCustom">Set</button></div>
    <label class="option"><input id="sound" type="checkbox" checked> Play alarm when finished</label>
    <button type="button" class="action full" id="fullscreen">Enter fullscreen</button>
    <p class="fine">Keyboard: Space = start/pause · R = reset · F = fullscreen · M = menu</p>
    <p class="fine">Made for students by <a href="https://biharkalyan.in" target="_blank" rel="noopener noreferrer">BiharKalyan.in</a></p>
    <p class="fine">Keep this page open. Background tabs, device sleep and some mobile browsers may delay the alarm.</p>
  </section>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const clock = $('clock'), message = $('message'), menu = $('menu'), toggle = $('menuToggle');
    const startPause = $('startPause'), fullscreen = $('fullscreen'), sound = $('sound');
    const presets = [...document.querySelectorAll('[data-minutes]')];
    let total = 25 * 60, remaining = total, deadline = 0, running = false, ticker = null, audio = null;
    let noticeTimeout = null;
    try { sound.checked = localStorage.getItem('study-focus-sound') !== 'false'; } catch (_) {}
    function format(sec) {
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      const part = n => String(n).padStart(2,'0');
      return h ? `${part(h)}:${part(m)}:${part(s)}` : `${part(m)}:${part(s)}`;
    }
    function render() {
      const t = format(remaining);
      clock.textContent = t; clock.classList.toggle('long',t.length > 5); clock.classList.toggle('finished',remaining === 0);
      document.title = `${t} | Study Focus Timer`;
      startPause.textContent = running ? 'Ⅱ' : '▶';
      startPause.setAttribute('aria-label',running ? 'Pause timer' : 'Start timer');
      startPause.title = running ? 'Pause (Space)' : 'Start (Space)';
    }
    function notice(text) {
      message.textContent = text; message.classList.add('visible');
      if (noticeTimeout) clearTimeout(noticeTimeout);
      noticeTimeout = setTimeout(()=>message.classList.remove('visible'),2600);
    }
    function prepareAudio() {
      if (!sound.checked) return;
      try { const C = window.AudioContext || window.webkitAudioContext; if (C) { audio ||= new C(); if (audio.state === 'suspended') audio.resume().catch(()=>{}); } } catch (_) {}
    }
    function alarm() {
      if (!sound.checked || !audio) return;
      try {
        const start = audio.currentTime + .03;
        for (let i=0;i<4;i++) {
          const osc=audio.createOscillator(), gain=audio.createGain(), at=start+i*.4;
          osc.type='sine';osc.frequency.value=i%2?780:990;
          gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.18,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.32);
          osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+.34);
        }
      } catch (_) { notice('Session finished. Audio is unavailable.'); }
    }
    function clearTicker(){ if(ticker!==null)clearInterval(ticker);ticker=null;running=false; }
    function tick() {
      if(!running)return;
      remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));render();
      if(remaining===0){clearTicker();render();notice('Session complete!');alarm();}
    }
    function playPause() {
      if(running){tick();if(running){clearTicker();render();notice('Paused');}return;}
      if(remaining===0)remaining=total;
      prepareAudio();deadline=Date.now()+remaining*1000;running=true;
      ticker=setInterval(tick,200);render();notice('Focus session started');
    }
    function reset(){clearTicker();remaining=total;render();notice('Timer reset');}
    function choose(minutes,button){clearTicker();total=minutes*60;remaining=total;presets.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();notice(`${minutes}-minute timer ready`);setMenu(false);}
    function setMenu(open){menu.hidden=!open;toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close settings menu':'Open settings menu');toggle.textContent=open?'×':'☰';}
    function setCustom(){const value=Number($('customMinutes').value);if(!Number.isInteger(value)||value<1||value>999){notice('Enter 1–999 minutes');$('customMinutes').focus();return;}choose(value,null);}
    async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();setMenu(false);}else{notice('Fullscreen is not supported in this browser.');}}catch(_){notice('Fullscreen was blocked by your browser.');}updateFullscreen();}
    function updateFullscreen(){fullscreen.textContent=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen';}
    startPause.addEventListener('click',playPause);
    $('reset').addEventListener('click',reset);
    toggle.addEventListener('click',()=>setMenu(menu.hidden));
    $('setCustom').addEventListener('click',setCustom);
    $('customMinutes').addEventListener('keydown',e=>{if(e.key==='Enter')setCustom();});
    presets.forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.minutes),b)));
    sound.addEventListener('change',()=>{try{localStorage.setItem('study-focus-sound',String(sound.checked));}catch(_){}if(sound.checked)prepareAudio();});
    fullscreen.addEventListener('click',toggleFullscreen);
    document.addEventListener('fullscreenchange',updateFullscreen);
    document.addEventListener('pointerdown',e=>{if(!menu.hidden && !menu.contains(e.target) && !toggle.contains(e.target))setMenu(false);});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape' && !menu.hidden){setMenu(false);return;}
      const editable=e.target instanceof HTMLElement && (e.target.matches('input,textarea,select')||e.target.isContentEditable);
      if(editable||e.altKey||e.ctrlKey||e.metaKey)return;
      if(e.code==='Space'){e.preventDefault();playPause();}
      else if(e.key.toLowerCase()==='r'){reset();}
      else if(e.key.toLowerCase()==='f'){toggleFullscreen();}
      else if(e.key.toLowerCase()==='m'){setMenu(menu.hidden);}
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
    render();
  })();
  </script>
</body>
</html>
