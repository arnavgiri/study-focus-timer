
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <link rel="icon" type="image/webp" href="favicon.webp">
  <meta name="description" content="A clean, distraction-free fullscreen study timer for students.">
  <title>Study Focus Timer | BiharKalyan.in</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #8be6bb;
      --border: rgba(255,255,255,.11);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, Arial, sans-serif;
      overflow: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      pointer-events: none;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      opacity: .6;
      transition: opacity .2s, background .2s;
      pointer-events: auto;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      opacity: 1;
      background: rgba(255,255,255,.12);
    }

    .icon-btn svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .timer-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .timer {
      font-size: clamp(90px, 22vw, 360px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.065em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
      text-align: center;
      transition: color .3s;
    }

    .timer.finished {
      color: var(--accent);
    }

    .side-controls {
      position: fixed;
      z-index: 10;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: .6;
      transition: opacity .2s;
    }

    .side-controls:hover,
    .side-controls:focus-within {
      opacity: 1;
    }

    .control-btn {
      height: 48px;
      width: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      color: var(--text);
      transition: background .2s, transform .2s;
    }

    .control-btn:hover {
      background: rgba(139,230,187,.18);
      transform: scale(1.08);
    }

    .control-btn svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 29;
      background: rgba(0,0,0,.55);
      opacity: 0;
      visibility: hidden;
      transition: .25s;
    }

    .menu-backdrop.show {
      opacity: 1;
      visibility: visible;
    }

    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(340px, 88vw);
      z-index: 30;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 26px 22px;
      transform: translateX(-100%);
      transition: transform .25s ease;
      overflow-y: auto;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 34px;
    }

    .menu-header h2 {
      font-size: 21px;
    }

    .close-btn {
      background: transparent;
      color: var(--text);
      border: 0;
      font-size: 28px;
      padding: 4px 10px;
    }

    .section-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .preset {
      padding: 13px 8px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .preset.active {
      background: var(--accent);
      color: #092116;
      border-color: var(--accent);
      font-weight: 700;
    }

    .custom-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .custom-row input {
      min-width: 0;
      width: 100%;
      padding: 13px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      outline: none;
    }

    .apply-btn {
      padding: 0 17px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #092116;
      font-weight: 700;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .setting-row input {
      width: 19px;
      height: 19px;
      accent-color: var(--accent);
    }

    .menu-footer {
      margin-top: 42px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .menu-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 14px;
      }

      .timer {
        font-size: clamp(64px, 20vw, 140px);
      }

      .side-controls {
        right: 50%;
        top: auto;
        bottom: 22px;
        transform: translateX(50%);
        flex-direction: row;
      }

      .control-btn {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <!-- Top navigation -->
  <header class="topbar">
    <button class="icon-btn" id="menuButton"
      aria-label="Open settings" aria-controls="menuPanel"
      aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <button class="icon-btn" id="fullscreenButton"
      aria-label="Enter fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
      </svg>
    </button>
  </header>

  <!-- Main timer -->
  <main class="timer-screen">
    <h1 class="timer" id="timerDisplay"
      role="timer" aria-label="Time remaining">25:00</h1>
    <span class="sr-only" id="timerStatus"
      role="status" aria-live="polite"></span>
  </main>

  <!-- Side controls -->
  <div class="side-controls">

    <button class="control-btn" id="startButton"
      aria-label="Start timer" title="Start / Pause">
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m8 5 11 7-11 7z"/>
      </svg>
    </button>

    <button class="control-btn" id="resetButton"
      aria-label="Reset timer" title="Reset">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 11a9 9 0 1 1 2.5 6.3"/>
        <path d="M3 4v7h7"/>
      </svg>
    </button>

  </div>

  <!-- Settings menu -->
  <div class="menu-backdrop" id="menuBackdrop"></div>

  <aside class="menu-panel" id="menuPanel"
    aria-label="Timer settings" aria-hidden="true">

    <div class="menu-header">
      <h2>Study Focus</h2>
      <button class="close-btn" id="closeMenu"
        aria-label="Close settings">&times;</button>
    </div>

    <p class="section-label">Study Duration</p>

    <div class="presets">
      <button class="preset active" data-minutes="25">25 Minutes</button>
      <button class="preset" data-minutes="45">45 Minutes</button>
      <button class="preset" data-minutes="60">60 Minutes</button>
      <button class="preset" data-minutes="5">5 Min Break</button>
    </div>

    <p class="section-label">Custom Timer</p>

    <div class="custom-row">
      <input id="customMinutes" type="number"
        min="1" max="999" placeholder="Minutes"
        aria-label="Custom duration in minutes">
      <button class="apply-btn" id="applyCustom">Set</button>
    </div>

    <p class="section-label">Preferences</p>

    <label class="setting-row">
      <span>Play alarm when finished</span>
      <input type="checkbox" id="alarmToggle" checked>
    </label>

    <div class="menu-footer">
      Made for focused learning.<br><br>
      Developed by
      <a href="https://biharkalyan.in"
        target="_blank" rel="noopener noreferrer">
        BiharKalyan.in
      </a>
    </div>

  </aside>

  <script>
    "use strict";

    const timerDisplay = document.getElementById("timerDisplay");
    const timerStatus = document.getElementById("timerStatus");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const playIcon = document.getElementById("playIcon");

    const menuButton = document.getElementById("menuButton");
    const closeMenuButton = document.getElementById("closeMenu");
    const menuPanel = document.getElementById("menuPanel");
    const menuBackdrop = document.getElementById("menuBackdrop");

    const fullscreenButton = document.getElementById("fullscreenButton");
    const customMinutes = document.getElementById("customMinutes");
    const applyCustom = document.getElementById("applyCustom");
    const alarmToggle = document.getElementById("alarmToggle");
    const presets = document.querySelectorAll(".preset");

    let selectedSeconds = 25 * 60;
    let remainingSeconds = selectedSeconds;
    let running = false;
    let endTime = 0;
    let intervalId = null;
    let audioContext = null;

    const playSVG = '<path d="m8 5 11 7-11 7z"/>';
    const pauseSVG =
      '<path d="M8 5v14M16 5v14"/>';

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;

      return String(minutes).padStart(2, "0") +
        ":" + String(secs).padStart(2, "0");
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(remainingSeconds);
      document.title = formatTime(remainingSeconds) +
        " | Study Focus Timer";
    }

    function updateControls() {
      playIcon.innerHTML = running ? pauseSVG : playSVG;
      startButton.setAttribute(
        "aria-label", running ? "Pause timer" : "Start timer"
      );
      startButton.title = running ? "Pause" : "Start";
    }

    function clearTimer() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }

      running = false;
      updateControls();
    }

    function prepareAudio() {
      if (!alarmToggle.checked) return;

      try {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      } catch (error) {
        console.warn("Audio unavailable:", error);
      }
    }

    function playAlarm() {
      if (!alarmToggle.checked || !audioContext) return;

      try {
        const now = audioContext.currentTime;

        for (let i = 0; i < 3; i++) {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "sine";
          oscillator.frequency.value = 880;

          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          const start = now + i * 0.45;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.22, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(
            0.001, start + 0.30
          );

          oscillator.start(start);
          oscillator.stop(start + 0.32);
        }
      } catch (error) {
        console.warn("Alarm could not play:", error);
      }
    }

    function finishTimer() {
      clearTimer();

      remainingSeconds = 0;
      updateDisplay();

      timerDisplay.classList.add("finished");
      timerStatus.textContent = "Study session completed.";

      playAlarm();
    }

    function tick() {
      if (!running) return;

      remainingSeconds = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      updateDisplay();

      if (remainingSeconds === 0) {
        finishTimer();
      }
    }

    function startTimer() {
      if (running) return;

      if (remainingSeconds === 0) {
        remainingSeconds = selectedSeconds;
      }

      prepareAudio();

      timerDisplay.classList.remove("finished");
      timerStatus.textContent = "Study session started.";

      endTime = Date.now() + remainingSeconds * 1000;
      running = true;

      updateControls();
      tick();

      intervalId = setInterval(tick, 200);
    }

    function pauseTimer() {
      if (!running) return;

      tick();
      clearTimer();
      timerStatus.textContent = "Study session paused.";
    }

    function resetTimer() {
      clearTimer();

      remainingSeconds = selectedSeconds;
      timerDisplay.classList.remove("finished");

      updateDisplay();
      timerStatus.textContent = "Timer reset.";
    }

    function setDuration(minutes) {
      if (!Number.isInteger(minutes) ||
          minutes < 1 || minutes > 999) {
        return;
      }

      selectedSeconds = minutes * 60;
      resetTimer();

      presets.forEach(button => {
        button.classList.toggle(
          "active", Number(button.dataset.minutes) === minutes
        );
      });

      closeSettings();
    }

    startButton.addEventListener("click", () => {
      running ? pauseTimer() : startTimer();
    });

    resetButton.addEventListener("click", resetTimer);

    presets.forEach(button => {
      button.addEventListener("click", () => {
        setDuration(Number(button.dataset.minutes));
      });
    });

    applyCustom.addEventListener("click", () => {
      const minutes = Number(customMinutes.value);

      if (!Number.isInteger(minutes) ||
          minutes < 1 || minutes > 999) {
        customMinutes.setCustomValidity(
          "Enter a whole number between 1 and 999."
        );
        customMinutes.reportValidity();
        return;
      }

      setDuration(minutes);
    });

    customMinutes.addEventListener("input", () => {
      customMinutes.setCustomValidity("");
    });

    customMinutes.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        applyCustom.click();
      }
    });

    function openSettings() {
      menuPanel.classList.add("open");
      menuBackdrop.classList.add("show");
      menuPanel.setAttribute("aria-hidden", "false");
      menuButton.setAttribute("aria-expanded", "true");
      closeMenuButton.focus();
    }

    function closeSettings() {
      const wasOpen = menuPanel.classList.contains("open");

      if (wasOpen && menuPanel.contains(document.activeElement)) {
        menuButton.focus();
      }

      menuPanel.classList.remove("open");
      menuBackdrop.classList.remove("show");
      menuPanel.setAttribute("aria-hidden", "true");
      menuButton.setAttribute("aria-expanded", "false");
    }

    menuButton.addEventListener("click", openSettings);
    closeMenuButton.addEventListener("click", closeSettings);
    menuBackdrop.addEventListener("click", closeSettings);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeSettings();
      }
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          if (!document.documentElement.requestFullscreen) {
            return;
          }

          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen unavailable:", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const isFullscreen = Boolean(document.fullscreenElement);

      fullscreenButton.setAttribute(
        "aria-label",
        isFullscreen ? "Exit fullscreen" : "Enter fullscreen"
      );

      fullscreenButton.title =
        isFullscreen ? "Exit fullscreen" : "Enter fullscreen";
    });

    // Recalculate the timer when returning to the tab.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) tick();
    });

    updateDisplay();
    updateControls();
  </script>

</body>
</html>
